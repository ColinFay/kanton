name: claude

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: python3 -m venv .venv && .venv/bin/pip install -q -e ".[app]" pytest && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash"
            --append-system-prompt "When your changes are pushed, open the pull request yourself with the pr skill instead of posting a Create a PR link."
